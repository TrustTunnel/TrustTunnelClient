<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root or trusttunnel group can own the service name on system bus -->
  <policy user="root">
    <allow own="com.adguard.TrustTunnel"/>
  </policy>

  <!--
    Prototype configuration: allow method invocation for default (any local user).
    In production deployments, restrict Start/Stop methods to group "trusttunnel"
    or authenticate caller via Polkit:
      <policy group="trusttunnel">
        <allow send_destination="com.adguard.TrustTunnel" send_interface="com.adguard.TrustTunnel.Vpn1"/>
      </policy>
  -->
  <policy context="default">
    <allow send_destination="com.adguard.TrustTunnel"
           send_interface="com.adguard.TrustTunnel.Vpn1"/>
    <allow send_destination="com.adguard.TrustTunnel"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow receive_sender="com.adguard.TrustTunnel"/>
  </policy>
</busconfig>
