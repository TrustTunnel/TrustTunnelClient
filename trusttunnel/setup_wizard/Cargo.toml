[package]
name = "setup_wizard"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
clap = "4.3.8"
crossterm = "0.27"
ctrlc = "3.4"
dialoguer = "0.10.4"
lazy_static = "1.4.0"
once_cell = "1.17.2"
rustls = "0.21.1"
rustls-pemfile = "1.0.2"
serde = { version = "1.0.163", features = ["derive"] }
toml = "0.7.4"
x509-parser = "0.15.0"
trusttunnel-deeplink = { git = "https://github.com/TrustTunnel/TrustTunnel", tag = "v1.3.2-rc.1" }
trusttunnel-settings = { path = "../settings" }
trusttunnel-subscription = { path = "../subscription" }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
serde_json = "1.0"
