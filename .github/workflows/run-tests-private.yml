name: Run tests

env:
  CONAN_VER: 2.12
  CLANG_FORMAT_VER: 21.1.8
  BUILD_DIR: build

on:
  push:
    branches:
      - master
      - 'stable-*'
      - 'dev-*'
  pull_request:
  workflow_dispatch:

jobs:
# =============================================================================
# Private repository jobs (self-hosted runners)
# =============================================================================

  resolve-images:
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-client'
    uses: AdGuardSoftwareLimited/native-libs-common/.github/workflows/resolve-images.yml@master

  tests:
    name: ${{ matrix.name }} build
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-client'
    needs: [resolve-images]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: '["team-corelibs"]'
            container-image: ''
            artifact-name: test-results-linux-private
            results-path: build/junit.xml
            sccache-key: sccache-linux
            test-command: |
              set -euxo pipefail

              rm -rf build
              export CONAN_REPO_URL='${{ vars.CONAN_REPO_URL }}'
              cat > Dockerfile <<'EOF'
              # syntax=docker/dockerfile:1
              FROM adguard/core-libs:2.12 AS build

              # sccache caches the C/C++ compilations. The pinned binary is
              # installed once: this layer depends only on the base image, so it
              # stays cached across runs (the native-tests stage is rebuilt by
              # --no-cache-filter, this one is not).
              RUN curl -fsSL https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz \
                  | tar -xz -C /usr/local/bin --strip-components=1

              WORKDIR /src
              COPY . .

              # The image bundles a Conan, but the private workflow installs an
              # upgraded one via pip just like the previous container job did.
              RUN python3 -m pip install conan --upgrade

              FROM build AS native-tests

              RUN --mount=type=secret,id=conan_repo_url,required=true \
                  --mount=type=secret,id=artifactory_user,required=true \
                  --mount=type=secret,id=artifactory_api_key,required=true <<END
              set -eux

              conan remote add --index 0 art "$(cat /run/secrets/conan_repo_url)" || true
              mkdir -p /src/results
              # The store was restored into .sccache and copied here by COPY . .;
              # CMAKE_LAUNCHER makes cmake use sccache for C/C++ compilations.
              export SCCACHE_DIR=/src/.sccache
              export PRESET=clang-relwithdebinfo-sanitizer
              export SKIP_BOOTSTRAP=1

              npm install -g markdownlint-cli

              # clangd-tidy is deliberately NOT run here due to memory constraints
              (make lint-md lint-rust clang-format && make test CMAKE_LAUNCHER=sccache) || test_status=$?

              echo "${test_status:-0}" > /src/results/test-status
              cp -a cmake-build-clang-relwithdebinfo-sanitizer/junit.xml /src/results/junit.xml 2>/dev/null || true

              conan remote login art "$(cat /run/secrets/artifactory_user)" \
                  --password "$(cat /run/secrets/artifactory_api_key)" || true
              conan upload -r art -c "*" 2>&1 | grep --line-buffered "Uploading" || true
              conan remove -c "*" || true
              conan cache clean || true

              exit 0
              END

              FROM scratch AS native-tests-output

              COPY --from=native-tests /src/results/junit.xml /junit.xml
              COPY --from=native-tests /src/results/test-status /test-status
              COPY --from=native-tests /src/.sccache /sccache
              EOF
              DOCKER_BUILDKIT=1 docker build --progress=plain \
                --no-cache-filter native-tests \
                --secret id=conan_repo_url,env=CONAN_REPO_URL \
                --secret id=artifactory_user,env=ARTIFACTORY_USER \
                --secret id=artifactory_api_key,env=ARTIFACTORY_API_KEY \
                --target native-tests-output \
                --output type=local,dest=build \
                -f Dockerfile .

              test "$(cat build/test-status)" -eq 0
            finally-script: |
              # Conan upload is performed inside the inline Dockerfile so it
              # also runs when the test command itself fails.
              true
          - name: Mac
            runs-on: '["ephemeral","ephemeral-mac","${{ needs.resolve-images.outputs.macos }}","ephemeral-limit-memory-6144","ephemeral-limit-cpu-6"]'
            container-image: ''
            artifact-name: test-results-macos-private
            results-path: cmake-build-clang-relwithdebinfo-sanitizer/junit.xml
            test-command: |
              set -e
              set -x

              # Builds go through the CMake presets; see CMakePresets.json.
              export PRESET=clang-relwithdebinfo-sanitizer
              # The image already provides the Conan dependencies.
              export SKIP_BOOTSTRAP=1

              rm -rf venv
              python3 -m venv venv
              source ./venv/bin/activate

              python3 -m pip install conan
              conan remote add --index 0 art ${{ vars.CONAN_REPO_URL }} || true

              # Ensure Rust is available (rust-toolchain.toml picks the version)
              export PATH="$HOME/.cargo/bin:$PATH"
              if ! command -v cargo &>/dev/null; then
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
                export PATH="$HOME/.cargo/bin:$PATH"
              fi

              make test
            finally-script: |
              set -e
              set -x

              # Each step runs in a fresh shell, so re-activate the venv
              # created by the test-command (conan lives there).
              source ./venv/bin/activate

              conan remote login art "$ARTIFACTORY_USER" --password "$ARTIFACTORY_API_KEY" || true
              conan upload -r art -c "*" 2>&1 | grep "Uploading" || true
              echo "conan upload finished"
              conan remove -c "*" || true
              conan cache clean || true
    uses: AdGuardSoftwareLimited/native-libs-common/.github/workflows/junit-tests.yml@feat/AG-57806-use-sccache-for-tests
    secrets:
      test-env: |
        ARTIFACTORY_USER=${{ secrets.ARTIFACTORY_USER }}
        ARTIFACTORY_API_KEY=${{ secrets.ARTIFACTORY_API_KEY }}
      sccache-config: ${{ secrets.REGISTRY_CACHE_AUTH }}
    with:
      runs-on: ${{ matrix.runs-on }}
      container-image: ${{ matrix.container-image }}
      test-command: ${{ matrix.test-command }}
      finally-script: ${{ matrix.finally-script }}
      results-path: ${{ matrix.results-path }}
      artifact-name: ${{ matrix.artifact-name }}
      sccache-key: ${{ matrix.sccache-key }}
      sccache-path: build/sccache

  win-build:
    name: Windows build
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-client'
    needs: [resolve-images]
    runs-on:
      - ephemeral
      - ephemeral-vmwin
      - ${{ needs.resolve-images.outputs.windows }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and run tests
        env:
          PRESET: msvc-relwithdebinfo
          BUILD_DIR: cmake-build-msvc-relwithdebinfo
        run: |
          $ErrorActionPreference = 'Stop'

          & conan remote add --index 0 art ${{ vars.CONAN_REPO_URL }}

          # Save vcvars to switch between them
          $vcvars64 = cmd /c "vcvars64 & set"
          function setvar($_) {
            if ($_ -match "=") {
              $v = $_.split("="); set-item -force -path "ENV:\$($v[0])"  -value "$($v[1])"
            }
          }

          & cargo test --workspace --manifest-path trusttunnel/setup_wizard/Cargo.toml
          if (!$?) { exit 1 }

          & {
            $vcvars64 | foreach { setvar $_ }
            # GNU make is not part of the Windows image, so the Windows job
            # drives the same preset through cmake directly.
            & cmake --preset $Env:PRESET
            if (!$?) { exit 1 }
            & cmake --build $Env:BUILD_DIR --target tests
            if (!$?) { exit 1 }
            & ctest --test-dir $Env:BUILD_DIR --output-junit junit.xml `
              --no-compress-output --output-on-failure
            if (!$?) { exit 1 }
          }
        shell: powershell

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows-private
          path: cmake-build-msvc-relwithdebinfo/junit.xml

      - name: Upload to Conan and cleanup
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          & conan remote login art "${{ secrets.ARTIFACTORY_USER }}" --password "${{ secrets.ARTIFACTORY_API_KEY }}"
          & conan upload -r art -c "*" 2>&1 | Select-String "Uploading" -SimpleMatch
          Write-Host "conan upload finished with status $LASTEXITCODE"
          & conan remove -c "*"
          & conan cache clean
        shell: powershell

  # clangd-tidy is the only lint step that needs serious memory
  lint:
    name: Lint (clangd-tidy)
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-client'
    needs: [resolve-images]
    permissions:
      contents: read
      id-token: write
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-images.outputs.corelibs-builder }}
      - ephemeral-limit-memory-12288
      - ephemeral-limit-cpu-8
    container:
      image: adguard/core-libs:2.12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Conan
        run: |
          set -e
          set -x
          conan remote add --index 0 art ${{ vars.CONAN_REPO_URL }} || true

      - name: Run clangd-tidy
        run: |
          set -e
          set -x
          SKIP_BOOTSTRAP=1 make clangd-tidy

