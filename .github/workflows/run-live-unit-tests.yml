name: Run live unit tests

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  resolve-images:
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-client'
    uses: AdGuardSoftwareLimited/native-libs-common/.github/workflows/resolve-images.yml@master

  run-live-unit-tests:
    name: Run live unit tests
    if: github.repository == 'AdGuardSoftwareLimited/trusttunnel-client'
    needs: [resolve-images]
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-images.outputs.corelibs-builder }}
      - ephemeral-limit-memory-8192
      - ephemeral-limit-cpu-6
      - ephemeral-job-key-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    container:
      image: adguard/core-libs:2.15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and run live unit tests
        env:
          CONAN_REPO_URL: ${{ vars.CONAN_REPO_URL }}
          # Builds go through the CMake presets; see CMakePresets.json.
          PRESET: clang-relwithdebinfo
          CMAKE_ARGS: -DVPNLIBS_ENABLE_LIVE_TESTS=ON
          # The image already provides the Conan dependencies.
          SKIP_BOOTSTRAP: 1
        run: |
          set -x -e

          python3 -m pip install conan --upgrade
          if ! conan remote list | grep -q '^art:'; then
            conan remote add --index 0 art ${CONAN_REPO_URL}
          fi
          make test-live

      - name: Upload to Conan and cleanup
        if: always()
        run: |
          conan remote login art "${{ secrets.ARTIFACTORY_USER }}" --password "${{ secrets.ARTIFACTORY_API_KEY }}" || echo "::warning::Conan remote login failed; the dependency cache will not be uploaded" >&2
          conan upload -r art -c "*" 2>&1 | grep "Uploading" || echo "::warning::Conan cache upload failed; continuing without the warmed cache" >&2
          echo "conan upload finished"
          conan remove -c "*" || echo "::warning::conan remove failed (non-fatal cleanup)" >&2
          conan cache clean || echo "::warning::conan cache clean failed (non-fatal cleanup)" >&2